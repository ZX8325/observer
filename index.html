<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>观测者</title>

  <!-- 样式可以内联，也可以外置成 .css 文件。这里选外置，方便改。 -->
  <link rel="stylesheet" href="./style.css" />
</head>
<!-- body 上的 class 决定当前是哪种模式（见 style.css）。
     先写死 mode-setup，免得页面加载瞬间两组控件同时闪一下。 -->
<body class="mode-setup">

<!-- ══════════════════════════════════════════════════════════════
     启动页 —— 「观测站接入仪式」  ★ 2026-09-21

     每次**刷新页面**都会出现的一道开机屏：左上角一个闪烁的光标，
     逐字打出四行接入日志，然后提示「按任意键，开始观测」。
     玩家按键或点屏幕 → 中央闪一道极淡的冷白光 → 整屏淡出 → 露出游戏。

     ⚠️ 它放在 body 的**最前面**，而且 z-index 比所有浮层都高（见 style.css）。
        这样从**第一帧**起它就盖着整个界面 —— 不然会先闪一下游戏再盖上，
        很难看。（它是纯 HTML + CSS，不依赖 JS，所以第一帧就在。）

     ⚠️ 三行文字**是空的**，由 `splash.js` 填进来。为什么不写死在这儿：
        写在 HTML 里 `_style_test.js` 就收不到 —— 那是**文风盲区**
        （这个坑本项目踩过四次，见 splash.js 抬头）。
        这里只留容器，一个字的文案都没有。

     ⚠️⚠️ 它和「观测指南」那个浮层**没有任何关系**（明确要求的）：
        这个是"进游戏前的门"，每次刷新都出现；
        那个是"点【开始演化】之后的教学"，讲怎么玩。
        代码、状态、DOM 全分开，谁也不知道对方存在。 -->
<div class="splash" id="splash">
  <!-- 四行日志 + 打字光标。光标**跟着当前行走**（由 splash.js 挪），
       所以它写在第一行里当初始位置 —— 也就是要的"左上角"。 -->
  <div class="splash-log" id="splash-log"><div class="splash-line"><span class="splash-caret" id="splash-caret"></span></div></div>

  <!-- 提示行。字由 splash.js 填（见上面那段） -->
  <div class="splash-hint" id="splash-hint"></div>

  <!-- 退场特效的元素**一个都没有了**。
       ★ 2026-09-21 第 3 版：把光刃和白球整个撤掉，改成"整屏平稳淡出"。
         现在退场**只有一件事** —— 给 `.splash` 这一层加 `.gone`，
         它自己 `transition: opacity`（见 style.css）。
         所以这里没有任何特效元素，**这是对的，不是漏了**。 -->
</div>

<!-- ══════════════════════════════════════════════════════════════
     星空背景画布
     ⚠️ 它必须是 .app 的**兄弟节点**，不能放进 .app 里面。

     为什么？画布是 position:fixed + z-index:0，属于「定位元素」。
     CSS 的绘制顺序规定：**定位元素永远画在普通流元素之上**。
     如果它待在 .app 里，就和信息栏、按钮处在同一层，
     哪怕 z-index 是 0，也会把「非定位」的信息栏和按钮盖住。
     （.app 自己的 z-index 救不了 —— 那是「对外」的层级，
       管不了它内部谁盖谁。）

     挪到外面之后，在 body 这一层里：
       画布 z-index 0  → 先画，在下面
       .app z-index 1  → 后画，浮在上面
     界面才能稳稳地浮在星空之上。
     ══════════════════════════════════════════════════════════════ -->
<canvas id="world"></canvas>

<div class="app">

  <!-- ── 顶部：阶段提示 ──
       ⚠️ 2026-09-15：原来这里有一行 `<h1 class="title">沙盒创世模拟器</h1>`，
          要求去掉 —— 「正式上线不叫这个名字」。
          **整块删掉了**，不是藏起来：
            · HTML 里的 h1
            · style.css 里的 `.title` 规则（不留死 CSS）
          `.topbar` 这一层留着 —— 它是 toast 的容器，而且
          `style.css` 那份「重新打开指针事件」的名单里有它（见 _wiring_test.js）。
          ⚠️ 省下来的竖向空间会自动流到 `.stage`（它是 flex:1）。 -->
  <header class="topbar">
    <!-- ── 观测编号 + 状态点（2026-09-15 加）──
         ★ 顶上原来是空的（标题删掉之后）。这一行把「观测站」的调性
           直接落到界面上：左边一个状态点，右边一串编号。

         ⚠️ 状态点是**有意义的**，不是装饰：
              呼吸 = 世界正在演化      静止变暗 = 暂停 / 已结束
            开关在 app.js 的 syncObsBar()，和 `world.running` 同一个源。

         ⚠️ 编号从**种子**推出来（OBS-XXXX），同一颗世界永远是同一个号 ——
            和「同种子 = 同世界」是同一条原则。 -->
    <div class="obs-bar">
      <span class="obs-dot" id="obs-dot"></span>
      <span class="obs-code" id="obs-code"></span>
      <!-- ★ 2026-09-16：世界名从底部信息栏**挪上来的**（已拍板）。

           ⚠️ 为什么动的是 HTML 而不是用 CSS 挪：
             它原来在 <section class="info"> 里 —— 和这一行**不是一个父级**。
             CSS 没法把元素搬进另一个容器；用绝对定位硬凹能骗过眼睛，
             但元素会**脱出顶栏的 flex 流**，屏宽一变位置就飘。

           ⚠️ `#info-name` 这个 id 一个字没动 → **app.js 一行都不用改**。
           ⚠️ 设置模式下它是空的，靠 `body.mode-setup .info-name:empty`
             整块收掉（连着左边那个「·」一起消失 —— 见 style.css）。 -->
      <div class="info-name" id="info-name"></div>
    </div>
    <!-- ⚠️⚠️ 2026-09-21：这里原来有一行常驻说明（`.palette-note`）——
         已拍板**删掉**。删掉的理由：它常驻白占一行（约 9u），
         而那块高度是**直接从星球扣的**。

         ⚠️ 那行字后来走了一条弯路，记在这儿免得再走一遍：
            先改成"开跑那一刻在观察日志里飘一句"（`Evolution.INTRO_HINT`），
            同一天又被**整条换掉** —— 改成起名字之后弹的**观测指南**整屏浮层
            （见下面 `<div class="guide">` 那一段）。
            飘一句只有四秒半，低头看星球就错过了，而那是**规则**。

         ⚠️ 别照着老版本把 `.palette-note` 加回来，也别把 `INTRO_HINT` 加回来。
            它原来还带着两条联动，也一起没了：
            · `body.civ-on .palette-note{display:none}`（style.css）—— 删了
            · `.palette-note` 的样式规则（style.css）—— 删了
           `_wiring_test.js` 第 21 节现在守的是**观测指南**这一个形态。 -->

    <div class="toast" id="toast"></div>
  </header>

  <!-- ── 中间：世界所在的那块区域 ──
       这个 main 是**空的**，只负责"占住中间那块地方"。
       它在页面上的位置和大小，就是 JS 用来决定
       「世界该画在哪、能画多大」的依据。 -->
  <main class="stage" id="stage">
    <!-- ── 观察日志 ★ 2026-09-21 加 ──
         文明**之前**那两分钟（混沌→冷却→海洋→大陆→生态）的旁白：
         阶段推进、卡住、投放反馈，都从顶栏挪到这里，以半透明小字浮现。

         ⚠️ 为什么浮在 `.stage` **里面**、而不是挂在视口上：
            `.stage` 是 flex:1，高度随窗口变。挂在视口上窗口一变就错位；
            挂在它里面并 `bottom` 贴边，**永远**落在"星球和读数条之间"。

         ⚠️⚠️ `pointer-events: none` 是**必须**的 ⚠️⚠️
            这一层盖在星球上面，而点星球 = 投放元素。
            不关掉指针事件，投放就全被它接走了。
            ⚠️ 另外**不要把它加进 style.css 那份"重新打开指针事件"的白名单**
               —— 那份名单是给按钮用的，加进去正好把上面这条毁掉。

         ⚠️ 只接**文明前**的字。文明阶段的征兆仍然走顶栏那条 `.toast`
            （见 app.js 的 showToast 分流），这一段不动。 -->
    <div class="log" id="log"></div>
  </main>

  <!-- ══════════════════════════════════════════════════════════════
       编年史 —— 文明阶段的主角

       世界走到文明之后，这块开始**逐条写出一份历史**：
       这个种族做过什么、遇到过什么、你怎么选的、最后怎么了。

       ⚠️ 它放在 .app **里面**（不是像结局面板那样的整屏浮层）——
          因为星球要留在上面看得见。玩家是一边看着那颗球，
          一边读它的历史。

       ⚠️ .app 上有 pointer-events: none，所以这一块必须加进
          style.css 那份"重新打开指针事件"的名单里，否则滚不动。
          （见 style.css 的 .topbar, .panel, ... 那一行）

       ⚠️ 平时是 hidden 的（靠 JS 切换），只有文明阶段才出现。
          用 hidden 属性而不是 class —— [hidden] 有 !important 兜底。

       每一行的内容由 app.js 按 world.evo.civ.rows 填进来，这里只留空壳。
       ══════════════════════════════════════════════════════════════ -->
  <section class="chronicle" id="chronicle" hidden>
    <div class="chronicle-head">
      <span class="chronicle-name" id="chron-name"></span>
      <span class="chronicle-era"  id="chron-era"></span>
    </div>
    <div class="chronicle-body" id="chron-body"></div>
  </section>

  <!-- ══════════════════════════════════════════════════════════════
       界面分两种模式，靠 body 上的 class 切换（见 style.css）：

         设置模式 mode-setup  ——  调参数，然后点【演化】
         观察模式 mode-watch  ——  滑杆锁死，专心看世界变化

       .setup-only 的东西只在设置模式显示，.watch-only 反之。
       ══════════════════════════════════════════════════════════════ -->

  <!-- ── 【设置模式】本源读数条（**不是滑杆，拖不动**）──
       这四行说的是这颗星球开出来是什么命：多热、多少水、多厚的大气、多少陆地。

       ⚠️⚠️ 2026-09-17 大改：这里**原来放的是四根 `<input type="range">`** ——
          它们长得和能拖的滑杆一模一样（蓝填充条 + 白色小方块）。
          审核员伸手去拖，拖不动，判了个「小工具功能缺陷」。

       ⚠️ 改法**不是**把它藏起来，是**让它长得就不像能拖的**：
          换成一条纯图形的读数条，**去掉那个白色小方块**。
          「这东西能拖」全靠小方块在暗示 —— 没有小方块 = 一条读数，
          天经地义不能拖。数值本身照旧一眼看得出。

       ⚠️ id 从 `sl-*`（slider）改成 `bar-*` —— 它已经不是滑杆了，
          名字留着会骗下一个读代码的人。

       ⚠️ **不要再换回 `<input>`**（哪怕加了 `disabled`）——
          那还是在屏幕上摆一个"控件"，和"这是读数"是两回事。
          `_wiring_test.js` 有断言盯着这一节里不许出现 `<input>`。

       ⚠️ 为什么本源不能调，见 app.js 里「把世界还给世界」那一大段。 -->
  <section class="panel setup-only" id="essence">
    <div class="row">
      <span class="row-name">能量浓度</span>
      <span class="row-bar" id="bar-energy"></span>
      <span class="row-val" id="val-energy">--</span>
    </div>
    <div class="row">
      <span class="row-name">水之本源</span>
      <span class="row-bar" id="bar-water"></span>
      <span class="row-val" id="val-water">--</span>
    </div>
    <div class="row">
      <span class="row-name">大气密度</span>
      <span class="row-bar" id="bar-atmo"></span>
      <span class="row-val" id="val-atmo">--</span>
    </div>
    <div class="row">
      <span class="row-name">大地之基</span>
      <span class="row-bar" id="bar-land"></span>
      <span class="row-val" id="val-land">--</span>
    </div>
  </section>

  <!-- ── 【观察模式】本源数值（只读）──
       ⚠️ 本源那一节整个藏起来（改不了了），但数值**留着**。
         （⚠️ 2026-09-17 改词：这里原来写"滑杆"——**滑杆早就不存在了**，
           2026-09-17 换成了读数条，见决策 #125。）
         因为看着"能量一格一格往下掉、大气一点点涨上来"
         本身就是观察的一部分 —— 那是世界在变化的证据。
         内容由 app.js 按 WorldGen.ESSENCE_KEYS 生成。 -->
  <section class="panel watch-only">
    <div class="readout" id="readout"></div>
  </section>

  <!-- ── 演化阶段指示条（两种模式都显示）──
       六段横条，由 app.js 按 Evolution.STAGES 生成，
       已过的点亮、当前的高亮呼吸、未来的灰暗。 -->
  <section class="stages" id="stages"></section>

  <!-- ── 【观察模式】基础元素栏 ──
       玩法：先点一个元素选中（会高亮），再点世界表面投放。

       八个元素分两类：
         · 火种 / 水珠 / 土石 / 气团 / 冰晶  —— 直接加/减局部本源
         · 雷种                              —— 随机触发一次天象
         · 光种 / 暗种                       —— 推高光暗值，还会打架

       内容由 app.js 按 Elements.LIST 生成，不用手写八个按钮。 -->
  <!-- ⚠️ 这个 palette-panel 类名是给文明阶段用的 ——
       走到文明之后 .palette-panel 会被收起来（见 style.css 的 body.civ-on），
       把地方让给编年史。 -->
  <section class="panel watch-only palette-panel">
    <!-- ⚠️ 2026-09-21：原来这里有一行常驻说明（`.palette-note`）——
         现在**整条没了**（不是搬走），省下的高度流给星球。
         它的内容进了开头那个「观测指南」浮层。
         ⚠️ 这一段注释原来写的是"搬到顶栏去了"，那是这条路的第一版；
            当天就被推翻了，别照那句话去找。 -->
    <div class="palette" id="palette"></div>
    <div class="palette-hint" id="palette-hint">选一个元素，再点世界表面投放</div>
  </section>

  <!-- ── 【观察模式】倍速按键 ──
       看快看慢由你。做成按键而不是滑杆 ——
       观察的时候只想"快一点/慢一点"，不需要精确到 0.1 倍。 -->
  <section class="panel watch-only">
    <div class="speeds" id="speeds"></div>
  </section>

  <!-- ── 信息栏：世界名 / 种子 / 特殊属性标签 ──
       种子才是这个世界的"身份证号"（同一个种子必然复现同一个世界），
       所以只显示种子就够，不再单独编号。

       世界名是玩家自己起的（点【演化】时弹出的那个窗口），
       写在种子上面一行 —— 从头到尾都看得到，边看演化边看见自己起的名字。 -->
  <section class="info">
    <!-- ── 世界名 ★ 2026-09-16 **搬去顶栏了**（原来在这个位置）──

         当初觉得它在底部单独占一行、字号偏大、和编年史抢视觉重心，
         拍板挪到顶栏和观测编号并排（`<header class="topbar">` 的 `.obs-bar` 里）。
         ⚠️ **不要搬回来** —— 底部那一行的空间现在是留给四属性 + 编年史的。 -->

    <!-- ──【换一个星球】★ 2026-09-14 从底部按钮挪上来的 ──
         原话是：「把换一个星球移动到种子XX上方，缩小居中，
         不用现在的 UI，只要字体下面加横线那种」。

         ⚠️ 三条都是定下的：
           ① 位置在**种子上面**（不是在按钮那一排）
           ② 样式是**带下划线的文字链**，不是实心药丸按钮
              —— 它是个"随时能点"的次要操作，不该和
                 【开始演化】那样的主操作抢注意力
           ③ 仍然**只在设置模式出现**（btnCreate.hidden 那行没改）

         ⚠️ 世界名那一行虽然在设置模式下是空的，但**高度一直占着**
            （见 style.css 里 .info-name 的 min-height），所以这一行
            上面那个空位是"名字以后要待的地方"，不是多余的。 -->
    <button class="info-create" id="btn-create" type="button">换一个星球</button>

    <!-- ⚠️「种子 ------」那一行**全程隐藏**（见 style.css 的 .info-seed）——
         藏起来不是删掉，分享机制以后还要用这个元素。 -->
    <div class="info-seed"   id="info-seed">种子 ------</div>

    <!-- 特殊属性标签（【双星系统】【剧毒大气】…）。
         ★ 2026-09-14：要求「除了隐藏种子外，双星系剧毒这种信息
           在**开始界面**也一起隐藏」—— 所以加了 `watch-only`。

         ⚠️⚠️ 类的名字容易看反，记牢：
             `watch-only` = **只在观察模式出现**（设置模式下藏起来）← 这个
             `setup-only` = 只在设置模式出现（观察模式下藏起来）← 不是这个
           两个的实际效果都写在 style.css 的 body.mode-* 那两条里。 -->
    <div class="info-traits watch-only" id="info-traits"></div>
  </section>

  <!-- ── 底部按钮 ──

       【换一个星球】 **只在设置模式出现** —— 想换一颗就点它，随便换多少次。
                   （旧名叫【开辟世界】—— 太抽象，改成了现在这个。）
                   演化一开始就藏起来（一局没走完不许中途重开）。
                   想换新星球？先点【重置】回设置模式，它就回来了。
       【演化】     设置模式里是"演化"，观察模式里是"暂停 / 继续"。
                   **一直在，走到文明之后也不消失** ——
                   那时世界还在转、文明光点还在点亮，你可以继续看。
       【重置】     只有观察模式才有（用 CSS 的 .watch-only 控制，
                   不走 JS）—— 退回混沌初始态，回设置模式重新调参再跑。

       显隐和文字全部由 app.js 的 syncButtons() 统一管，
       这里不写死 hidden，免得两边打架。 -->
  <!-- ⚠️ 三颗按钮，但**同一时刻最多两颗看得见**：
         · 设置模式：【开始演化】【观察记录】
         · 观察模式：【暂停 / 继续】【重置】
       【换一个星球】2026-09-14 挪到上面信息栏里去了（带下划线的文字链）。
       `.watch-only` / `.setup-only` 两个类由 CSS 按 body 上的 mode-* 切换
       （见 style.css），不用 JS 再管一遍。 -->
  <footer class="bottombar">
    <button class="btn btn-main"    id="btn-evolve"  type="button">开始演化</button>
    <button class="btn watch-only"  id="btn-reset"   type="button">重置</button>

    <!-- ── 档案库入口 ★ 2026-09-14 ──
         ★ 定稿的说法：「观察模式不要观察记录入口，只有开始画面有，

      <!-- 【清空】是**两下**才清的：点第一下变成「确定清空？」，
           再点一下才真清。不用 window.confirm —— 原生弹窗在一屏
           深色界面里很出戏，而两下确认一样能防手滑，还不用计时器。 -->
      <button class="btn archive-clear" id="btn-archive-clear" type="button">清空</button>
      <button class="btn btn-main" id="btn-archive-close" type="button">返回</button>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════
     记录页 —— 一个文明的完整全史  ★ 2026-09-14 新增

     从档案库点开一条时翻出来。**只读**：不装世界、不碰 world 变量。

     四节（由 app.js 的 fillRecordBody 填，**哪几节出现是变的**）：
       ── 星球 ──    评定 + 摘要 + 种子
       ── 文明 ──    文明名 / 原型·特质·倾向 / 命运 / 存活周期
       ── 编年史 ──  ★ 全部历史行（六种样式，见 style.css 的 .chron-row）
       ── 记录全文 ── 传记

     ⚠️ **没走到文明的世界只有「星球」和「记录全文」两节** ——
        文明/编年史/存活周期那三块整块不出现（没有就是没有，不许编）。

     ⚠️⚠️ 底部**必须留着出口**：这一层是整屏盖住的，
        点外面没反应、没有 Esc、刷新丢页面。藏光了玩家就出不去了。
        （结局面板踩过一次，`_wiring_test.js` 有断言守着这条。）

     ⚠️ 排版**复用结局面板那一整套类**（.end-sec / .end-row / .end-k /
        .end-v / .end-line / .ending-civname / .ending-civrows / .ending-bio）
        —— 新写的只有最外面 `.record` 那层容器。
        好处：以后改结局面板的排版，这一页跟着一起变，不会走样。
     ══════════════════════════════════════════════════════════════ -->
<div class="record" id="record">
  <div class="record-card">

    <div class="record-kicker">观 测 记 录 · 存 档</div>

    <!-- ⚠️ 这**只是一张图** —— 打开时现画一次、画完就扔，
         不是"活的世界"（2026-09-14 的原话：
         「星球就单存的留个图片，不是留之前的数据」）。
         尺寸写在 HTML 上（画布像素），显示大小由 style.css 定。 -->
    <div class="record-planetwrap">
      <canvas class="record-planet" id="record-planet" width="420" height="420"></canvas>
    </div>

    <!-- 四节都塞在这儿（app.js 的 fillRecordBody 建） -->
    <div id="record-body"></div>

    <!-- ⚠️ 两颗按钮的 class 和结局卡那两颗同一个规矩：
         想区分就靠 id，**不要给某一颗挂专属的类**。
         谁想"加个主次"，先看 style.css 里 .ending-actions 那段注释。 -->
    <div class="record-actions">
      <button class="btn btn-main" id="btn-record-back" type="button">返回列表</button>
      <button class="btn"           id="btn-record-home" type="button">回主界面</button>
    </div>

  </div>
</div>

     平台 CSP 的 script-src 不含 unsafe-inline，
     内联 <script>...</script>、onclick="..." 全部会被拦掉。
     ══════════════════════════════════════════════════════════════ -->

<!-- 核心逻辑（零 DOM 依赖）—— 加载顺序不能换，后面依赖前面 -->

<script src="./core/civEvents.js"></script>

<script src="./core/ending.js"></script>
<script src="./core/evolution.js"></script>

<!-- 绘制（只依赖一个 canvas 对象） -->
<script src="./render/renderer.js"></script>

     ⚠️ 排在 app.js **前面**：它是"进游戏前的门"，希望它一解析完就开始打字，
        不用等 app.js 把整个界面建起来（那段要几百毫秒，白等）。
     ⚠️ 它**不依赖任何东西**，app.js 也不依赖它 —— 两个互不相干，顺序凑巧而已。 -->
<script src="./splash.js"></script>

<!-- 外壳（主循环、事件、界面） -->
<script src="./app.js"></script>

</body>
</html>
